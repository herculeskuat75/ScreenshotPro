name: Build APK + Release (universal, auto-ekstrak ZIP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan proyek (ZIP di root diekstrak otomatis)
        run: |
          set -e
          WORK="$RUNNER_TEMP/proj"
          rm -rf "$WORK" && mkdir -p "$WORK"

          # Cari semua .zip di root repo, pilih yang commit-nya paling baru
          ZIP=""; BEST=0
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            echo "ZIP ditemukan: $z (commit time $t)"
            if [ -z "$ZIP" ] || [ "$t" -gt "$BEST" ]; then ZIP="$z"; BEST="$t"; fi
          done

          if [ -n "$ZIP" ]; then
            echo ">> Memakai ZIP: $ZIP"
            unzip -q -o "$ZIP" -d "$WORK"
            SRC="$WORK"
          else
            echo ">> Tidak ada ZIP, memakai isi repo langsung."
            SRC="$GITHUB_WORKSPACE"
          fi

          # Cari settings.gradle(.kts) paling dangkal (aman bila ZIP punya folder pembungkus)
          SET=$(find "$SRC" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) \
                  -not -path '*/__MACOSX/*' -not -path '*/.git/*' -not -path '*/build/*' \
                | awk '{ print gsub("/","/"), $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$SET" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan (di ZIP maupun repo)."
            exit 1
          fi
          PROJ_DIR=$(dirname "$SET")
          echo "PROJ_DIR=$PROJ_DIR" >> "$GITHUB_ENV"
          echo ">> Folder proyek: $PROJ_DIR"
          ls -la "$PROJ_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Kumpulkan APK
        run: |
          APK=$(find "$PROJ_DIR" -path '*/outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "ERROR: APK tidak ditemukan"; exit 1; fi
          echo "APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/AlfyDownloader.apk"
          echo "TAG=build-$(date -u +%Y%m%d-%H%M%S)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AlfyDownloader-APK
          path: AlfyDownloader.apk

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AlfyDownloader ${{ env.TAG }}
          files: AlfyDownloader.apk
          make_latest: true
