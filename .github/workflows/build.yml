name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip
        run: |
          unzip -oq "$(ls *.zip | head -n1)" -d _src
          echo "ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build
        run: cd "$ROOT" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotPro-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
